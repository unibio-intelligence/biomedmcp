[project]
name = "antibody-registry"
version = "0.0.1"
description = "MCP server for Antibody Registry database access"
authors = [{name = "UniBio Intelligence"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.2,<5.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.12.0,<3.0.0",
    "structlog>=24.1.0",
]

[project.scripts]
antibody-registry = "antibody_registry.main:main"

[project.urls]
Repository = "https://github.com/unibio-intelligence/biomedmcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["antibody_registry"]
