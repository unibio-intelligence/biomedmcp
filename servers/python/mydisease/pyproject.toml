[project]
name = "mydisease-mcp"
version = "0.0.1"
authors = [{name = "UniBio Intelligence"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.1.1,<3.0.0",
    "fastmcp>=4.0.2,<5.0.0",
    "httpx",
    "pydantic>=2.12.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/unibio-intelligence/biomedmcp"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
