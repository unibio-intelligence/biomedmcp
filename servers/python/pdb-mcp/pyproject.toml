[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdb-mcp"
version = "0.0.1"
description = "PDB (Protein Data Bank) MCP Server - Python implementation with 5 focused tools"
authors = [{name = "UniBio Intelligence"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.2,<5.0.0",
    "httpx>=0.25.0",
    "mmcif-pdbx==2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.package-data]
pdb_mcp = ["*.json"]

[project.urls]
Repository = "https://github.com/unibio-intelligence/biomedmcp"
