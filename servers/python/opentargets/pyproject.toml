[project]
name = "opentargets-mcp"
version = "0.0.1"
description = "MCP server for Open Targets Platform biomedical data access"
authors = [{name = "UniBio Intelligence"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["mcp", "open-targets", "biomedical", "drug-discovery", "genetics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.2,<5.0.0",
    "aiohttp",
    "python-dotenv",
    "thefuzz",
    "python-Levenshtein",
]

[project.scripts]
opentargets-mcp = "opentargets_mcp.server:main"

[project.urls]
Repository = "https://github.com/unibio-intelligence/biomedmcp"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
    "mcp>=2.1.1,<3.0.0",
    "pytest",
    "pytest-asyncio",
    "black",
    "ruff",
]
examples = [
    "openai",
]
